<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DraftLog logomark">
  <!--
    DraftLog logomark — "Draft Page"
    A notepad page with folded corner and draft lines.
    Represents drafting ideas and logging plans.
    Color: page inherits `currentColor`; lines carry brand accent Teal #0EA5E9.
    On dark backgrounds use #38BDF8.
  -->
  <path d="M10 6 H42 L54 18 V58 H10 Z" fill="currentColor"/>
  <path d="M42 6 L54 18 H42 Z" fill="#0EA5E9" opacity="0.5"/>
  <line x1="18" y1="28" x2="48" y2="28" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="36" x2="44" y2="36" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="44" x2="38" y2="44" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
</svg>
