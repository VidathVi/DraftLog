<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="DraftLog — AI-powered weekly planning for engineering teams">
  <!--
    DraftLog README banner — light theme.
    Draft Page lockup (logomark + wordmark) centered on paper, with tagline.
    Ink page, Teal #0EA5E9 accent lines + "Log" syllable, Slate tagline.
  -->
  <rect x="1" y="1" width="1278" height="358" rx="20" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Lockup -->
  <svg x="330" y="96" width="620" height="120" viewBox="0 0 330 64" preserveAspectRatio="xMidYMid meet" overflow="visible">
    <g transform="translate(-12 -3.5)">
      <path d="M10 6 H42 L54 18 V58 H10 Z" fill="#0A0A0A"/>
      <path d="M42 6 L54 18 H42 Z" fill="#0EA5E9" opacity="0.5"/>
      <line x1="18" y1="28" x2="48" y2="28" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="18" y1="36" x2="44" y2="36" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="18" y1="44" x2="38" y2="44" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="57" y="46" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
          font-size="48" font-weight="600" letter-spacing="-0.8"
          fill="#0A0A0A">Draft<tspan fill="#0EA5E9">Log</tspan></text>
  </svg>

  <text x="640" y="256" text-anchor="middle"
        font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif"
        font-size="20" font-weight="500" letter-spacing="0.02em"
        fill="#737373">AI-powered weekly planning for engineering teams</text>
</svg>
