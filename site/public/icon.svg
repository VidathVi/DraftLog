<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 10 44 44" role="img" aria-label="DraftLog">
  <!--
    DraftLog favicon — the Draft mark, tight-cropped.
    A stylized notepad page with a pencil stroke.
    Theme-aware: ink on light, paper on dark.
    Brand accent: Teal #0EA5E9.
  -->
  <style>
    .page { fill: #0A0A0A; }
    .line { stroke: #0EA5E9; }
    @media (prefers-color-scheme: dark) {
      .page { fill: #FAFAFA; }
      .line { stroke: #38BDF8; }
    }
  </style>
  <!-- Page shape with folded corner -->
  <path class="page" d="M16 12 H44 L52 20 V52 H16 Z"/>
  <path fill="#0EA5E9" d="M44 12 L52 20 H44 Z" opacity="0.6"/>
  <!-- Draft lines -->
  <line class="line" x1="22" y1="26" x2="46" y2="26" stroke-width="2.5" stroke-linecap="round"/>
  <line class="line" x1="22" y1="33" x2="42" y2="33" stroke-width="2.5" stroke-linecap="round"/>
  <line class="line" x1="22" y1="40" x2="38" y2="40" stroke-width="2.5" stroke-linecap="round"/>
</svg>
